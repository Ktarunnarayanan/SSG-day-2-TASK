<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="font-size: 20px;">Student Registration Form</h1>
    <br>
    <table border="0">
        <tr>
            <th><label><b>Roll no:<b></label></th>
            <td><input type="number" style="width: 353px;"></td>    
        </tr>
        <tr>
            <th><label><b>Student name:<b></label></th>
            <td><input type="text" placeholder="First name">
            <label>-</label>
            <input type="text" placeholder="Last Name">
            </td>
        </tr>
        <tr>
            <th><label><b>Father's name:<b></label></th>
            <td><input type="text" style="width: 353px;"></td>    
        </tr>
        <tr>
            <th><label><b>Date of birth:</b></label></th>
            <td>
                <select>
        <option>Day</option>
        <option>Sun</option>
        <option>Mon</option>
        <option>Tue</option>
        <option>Wed</option>
        <option>Thur</option>
        <option>Fri</option>
        <option>Sat</option>
    </select>
    <select>
        <option>Month</option>
        <option>Jan</option>
        <option>Feb</option>
        <option>Mar</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
        <option>Aug</option>
        <option>Sept</option>
        <option>Oct</option>
        <option>Nov</option>
        <option>Dec</option>
    </select>
    <select>
        <option>Year</option>
    </select>
    <label><b><i>(DD-MM-YYYY)</i></b></label>
            </td>
        </tr>
        <tr>
            <th><label><b>Mobile no:</b></label></th>
            <td>
                <input type="text" style="width: 20px;" value="+91" >
    <label>-</label>
    <input type="number" style="width: 311px;">
            </td>
        </tr>
        <tr>
            <th><label><b>Email id:</b></label></th>
            <td><input type="email" style="width: 353px;"></td>
        </tr>
        <tr>
            <th><label><b>Password:</b></label></th>
            <td><input type="password" style="width: 353px;"></td>
        </tr>
        <tr>
            <th><label><b>Gender:</b></label></th>
            <td>
                <input type="radio">
    <label>Male</label>
    <input type="radio">
    <label>Female</label>
            </td>
        </tr>
        <tr>
            <th><label><b>Department:</b></label></th>
            <td>
                <input type="checkbox">
    <label>CSE</label>
    <input type="checkbox">
    <label>IT</label>
    <input type="checkbox">
    <label>ECE</label>
    <input type="checkbox">
    <label>CIVIL</label>
    <input type="checkbox">
    <label>MECH</label>
            </td>
        </tr>
        <tr>
            <th><label><b>Course:</b></label></th>
            <td>
                <select style="width: 359px;">
        <option>-----------------------Select Current course's----------------------</option>
        <option></option>
        <option></option>
        <option></option>
        <option></option>
        <option></option>
    </select>
            </td>
        </tr>
        <tr>
            <th><label><b>Student photo:</b></label></th>
            <td><button>Choose File</button>
    <label>No file chosen</label>
            </td>
        </tr>
        <tr>
            <th><label><b>City:</b></label></th>
            <td>
                <input type="text" style="width: 353px;">
            </td>
        </tr>
        <tr>
            <th><label><b>Address:</b></label></th>
            <td><textarea style="width: 354px;">Enter your Address</textarea>
            </td>
        </tr>
    </table>
</body>
</html>
